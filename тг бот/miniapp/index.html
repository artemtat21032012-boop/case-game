<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Case Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

body {
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
}


.container {

    text-align:center;
    padding:30px;

}


h1 {

    font-size:38px;

}


.case-box {

    background:#1e293b;

    border-radius:25px;

    padding:30px;

    margin-top:30px;

}



.case {

    font-size:110px;

    margin:20px;

}



.balance {

    font-size:25px;

    margin:20px;

}



button {

    background:#2563eb;

    color:white;

    border:0;

    padding:18px 40px;

    border-radius:15px;

    font-size:22px;

}



#result {

    margin-top:30px;

    font-size:24px;

}



.item {

    background:#334155;

    padding:20px;

    border-radius:15px;

}



</style>


</head>


<body>


<div class="container">


<h1>
🎁 Case Game
</h1>


<div class="case-box">


<div class="case">
📦
</div>


<div class="balance">

💰 Монеты:
<span id="coins">1000</span>

</div>


<button onclick="openCase()">

Открыть кейс

</button>



<div id="result"></div>



</div>


</div>





<script>


// подключение Telegram

const tg = window.Telegram.WebApp;

tg.ready();

tg.expand();




// баланс

let coins = 1000;



// предметы

const items = [

{
name:"🧢 Обычная кепка",
rarity:"Обычный"
},

{
name:"🔪 Нож",
rarity:"Редкий"
},

{
name:"💎 Алмазный скин",
rarity:"Эпический"
},

{
name:"🔥 Легендарный предмет",
rarity:"Легендарный"
}

];





function openCase(){


if(coins < 100){

document.getElementById("result").innerHTML =
"❌ Недостаточно монет";

return;

}



coins -= 100;


document.getElementById("coins").innerHTML = coins;



let item =
items[Math.floor(Math.random()*items.length)];



document.getElementById("result").innerHTML = `

<div class="item">

🎉 Выпало:

<br><br>

<b>${item.name}</b>

<br><br>

⭐ Редкость: ${item.rarity}

</div>

`;



}


</script>


</body>

</html>
